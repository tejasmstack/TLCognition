[project]
name = "tlc"
version = "0.1.0"
description = "TLC plate readout system: deterministic measurement pipeline + VLM semantic layer"
requires-python = "==3.12.13"
dependencies = [
    "numpy==2.2.6",
    "scipy==1.16.1",
    "scikit-image==0.25.2",
    "imageio==2.37.0",
    "pillow==11.3.0",
    "h5py==3.14.0",
    "pydantic==2.11.7",
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
    "sqlalchemy==2.0.43",
    "alembic==1.16.4",
    "typer==0.16.0",
    "structlog==25.4.0",
    "python-multipart==0.0.20",
]

[dependency-groups]
dev = [
    "pytest==8.4.1",
    "hypothesis==6.138.3",
    "httpx==0.28.1",
    "ruff==0.12.10",
    "pytest-cov==6.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tlc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "corpus: tests that run over the real dataset images",
    "slow: long-running tests (null battery at full n)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
