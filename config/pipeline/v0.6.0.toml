# config/pipeline/v0.6.0.toml — IMMUTABLE ONCE RELEASED (spec 03 §7.10). Every number that can
# change a result lives here and is hashed into run_key. Pre-calibration release (Phases 0-5).
# Differs from v0.5.0 in one line: the operating point is OPERATING_POINT_v3, selected on the Gate 4
# tuning split of the 600-plate battery (D-030). v0.5.0 stays on disk so its runs replay exactly.
version = "0.6.0"
schema_version = "1"
seed_salt = 20260826

[capture_gates]
green_clip_max          = 0.15    # F1: above -> photometry_mode = positions_only  (spec 03 §7.3.4)
green_clip_unusable     = 0.40    # spec 01 §6.2 row 4 (D-014 in spec 03 says 0.60; stricter wins — brief §1)
lane_clip_abstain       = 0.20    # spec 01 §6.2 row 5
lane_clip_area_max      = 0.02    # spec 01 §6.2 row 6
frame_overrun_max       = 0.02
px_per_lane_min         = 10.0    # spec 01 §6.2 row 13
vif_abstain             = 6.0     # spec 01 §6.2 row 14
origin_ci90_max_frac    = 0.08    # spec 01 §6.2 row 10

[geometry]
plate_hue_range         = [0.18, 0.58]
plate_min_saturation    = 0.12
plate_min_value_floor   = 0.25
otsu_min_class_ratio    = 1.35
erosion_base_px         = 2
erosion_per_deg_tilt    = 0.55    # M-007: not a fixed constant
frame_snap_px           = 2.0
idempotency_max_px      = 0.5

[photometry]
signal_channel          = "green"
od_transform            = "log10"           # kubelka_munk FORBIDDEN in this regime (F5)
primary_background      = "poly3"           # D-007
sigma_method            = "mad_diff_1.4826_prespot"   # D-008; F4: measured ONCE, before masking
sigma_max_relative_spread = 0.15            # Gate 3
lane_halfwidth_frac     = 0.275             # eval: 55% of pitch
nominal_spot_width_frac = 0.18

[noise]
highpass_sigma_px       = 6.0               # spec 01 §2.1, FIXED
max_lag_px              = 24
prepass_radius_px       = 16
prepass_k               = 2.0
border_ring_px          = 4

[ensemble]                                  # D-009: spec 01 §2.3 design, not the eval's 4x4x2
grid_id                 = "CONFIG_GRID_v1"
grid_ref                = "config/ensemble/CONFIG_GRID_v1.json"
n_surrogates            = 60
max_surrogates          = 400
bh_q                    = 0.10
z_floor                 = 3.0
match_tol_fwhm          = 0.4
jeffreys_alpha          = 0.5

[operating_point]                           # D-030: selected on the Gate 4 tuning split (600 plates)
ref                     = "config/ensemble/OPERATING_POINT_v3.json"

[peaks]
model                   = "emg"             # F11; position = mode (D-014)
tail_ratio_streak       = 3.0
streak_fraction_limit   = 0.55              # ported (tlc-spec-impl)
streak_run_fwhm_limit   = 2.5

[origin]
min_dots                = 2                 # two-dot rule
dot_compact_min         = 0.60
dot_k_sigma             = 3.0
zone_frac               = [0.80, 0.90]

[bands]                                     # convention defaults until the VLM/operator supplies them
header_frac             = 0.16
label_row_frac          = 0.90
